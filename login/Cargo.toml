[workspace]
resolver = "2"
members = [
    "shared",
    "auth-service",
    "api-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["trace", "cors"] }
hyper = { version = "1" }

# Database
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "uuid", "macros", "json"] }

# Cache
# `rediss://` needs rustls + tokio. `tls-rustls-insecure` enables URL fragment `#insecure` or
# env `REDIS_TLS_INSECURE=1` when a host (e.g. Render) is strict about certs / SNI.
# We use OS trust roots (`ca-certificates` in the image), not bundled webpki-roots only.
redis = { version = "0.27", features = [
    "tokio-comp",
    "connection-manager",
    "tls-rustls",
    "tokio-rustls-comp",
    "tls-rustls-insecure",
] }

# Auth / Crypto
argon2 = "0.5"
jsonwebtoken = "9"
rand = { version = "0.8", features = ["std"] }
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (gateway → auth-service)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
subtle = "2"
